<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZINK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=PT+Sans:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
.home { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
.home__head { padding: 24px 36px; flex: none; position: relative; z-index: 2; }
.home__stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding-bottom: 40px; }
.book-wrap { position: relative; perspective: 2200px; perspective-origin: 50% 40%; animation: zkin 1.1s cubic-bezier(.2,.7,.2,1) both; }
.book-shadow { position: absolute; left: 40px; right: 40px; bottom: -34px; height: 60px; border-radius: 50%; background: rgba(58,53,46,.30); filter: blur(22px); transition: transform .7s cubic-bezier(.2,.7,.2,1); }
.book { position: relative; width: 1040px; height: 690px; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.2,.7,.2,1); }
.book__paper { position: absolute; left: -30px; top: -20px; width: 1100px; height: 740px; overflow: visible; }
.book__light { position: absolute; inset: 0; pointer-events: none; transition: background .9s; }
.ink { mix-blend-mode: multiply; }
.book__left { position: absolute; left: 0; top: 0; width: 520px; height: 690px; display: flex; align-items: center; justify-content: center; }
.hero { display: flex; flex-direction: column; gap: 28px; }
.hero__title { margin: 0; font-family: 'Courier New', 'Courier Prime', 'Nimbus Mono PS', FreeMono, monospace; font-weight: 400; font-size: 40px; line-height: 1.08; letter-spacing: -0.02em; text-shadow: 0 0 .6px rgba(20,20,19,.55); color: #141413; }
.hero__btn { align-self: flex-start; height: 50px; min-height: 50px; padding: 0 24px; background: #141413; color: #F4F2EC; font-size: 17px; letter-spacing: -.01em; }
.book__photo { position: absolute; left: 632px; top: 100.9px; width: 296.1px; height: 395.3px; object-fit: cover; }
.book__drawing { position: absolute; left: 657.4px; top: 496.2px; width: 251px; height: auto; }
@keyframes zkin { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .book, .book-shadow { transition: none; } .book-wrap { animation: none; } }

/* Телефон: книжка раскладывается в две страницы друг под другом */
.mpages { display: none; }
@media (max-width: 760px) {
  .home { height: auto; min-height: 100dvh; overflow: visible; }
  .home__head { padding: 18px 20px; }
  .home__stage { display: none; }
  .mpages { display: flex; flex-direction: column; gap: 18px; padding: 4px 16px 32px; }
  .mpage { position: relative; background: #ECEAE6; border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 14px 30px rgba(58,53,46,.16); overflow: hidden; }
  .mpage::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .48  0 0 0 0 .45  0 0 0 .35 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .mpage--hero { padding: 64px 28px 56px; }
  .mpage--hero .hero__title { font-size: clamp(28px, 8.4vw, 40px); }
  .mpage--photo { padding: 36px 32px 40px; display: flex; flex-direction: column; align-items: center; }
  .mpage--photo img:first-child { width: 78%; }
  .mpage--photo img:last-child { width: 66%; margin-top: 0; }
}
</style>
</head>
<body>
<div class="home" id="home">
  <header class="home__head"><a class="logo" href="index.html">ZINK</a></header>

  <main class="home__stage">
    <div class="book-wrap">
      <div class="book-shadow" id="shadow" aria-hidden="true"></div>
      <div class="book" id="book">
        <svg aria-hidden="true" viewBox="-30 -20 1100 740" class="book__paper">
          <defs>
            <filter id="zk-paper" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
              <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="31" result="t"></feTurbulence>
              <feDiffuseLighting in="t" surfaceScale="1.3" lighting-color="#FFFFFF" result="l"><feDistantLight azimuth="230" elevation="64"></feDistantLight></feDiffuseLighting>
              <feComponentTransfer in="l" result="grain"><feFuncR type="linear" slope=".11" intercept=".9"></feFuncR><feFuncG type="linear" slope=".11" intercept=".9"></feFuncG><feFuncB type="linear" slope=".11" intercept=".895"></feFuncB><feFuncA type="linear" slope="0" intercept="1"></feFuncA></feComponentTransfer>
              <feBlend in="SourceGraphic" in2="grain" mode="multiply" result="g1"></feBlend>
              <feTurbulence type="fractalNoise" baseFrequency="0.004 0.007" numOctaves="3" seed="5" result="b"></feTurbulence>
              <feColorMatrix in="b" values=".06 0 0 0 .945  .06 0 0 0 .943  .06 0 0 0 .938  0 0 0 0 1" result="blotch"></feColorMatrix>
              <feBlend in="g1" in2="blotch" mode="multiply" result="g2"></feBlend>
              <feComposite in="g2" in2="SourceGraphic" operator="in" result="g3"></feComposite>
              <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="2" seed="9" result="w"></feTurbulence>
              <feDisplacementMap in="g3" in2="w" scale="5" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
            </filter>
            <filter id="zk-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"></feGaussianBlur></filter>
            <linearGradient id="zk-gl" x1="0" x2="1" y1="0" y2="0">
              <stop offset="0" stop-color="#E4E1DD"></stop>
              <stop offset=".06" stop-color="#ECEAE6"></stop>
              <stop offset=".5" stop-color="#EEECE9"></stop>
              <stop offset=".78" stop-color="#E8E6E2"></stop>
              <stop offset=".93" stop-color="#D9D6D1"></stop>
              <stop offset="1" stop-color="#BFBAB3"></stop>
            </linearGradient>
            <linearGradient id="zk-gr" x1="0" x2="1" y1="0" y2="0">
              <stop offset="0" stop-color="#CCC8C2"></stop>
              <stop offset=".035" stop-color="#E6E4E0"></stop>
              <stop offset=".1" stop-color="#F4F3F0"></stop>
              <stop offset=".45" stop-color="#F0EEEB"></stop>
              <stop offset=".9" stop-color="#EAE8E4"></stop>
              <stop offset="1" stop-color="#E2DFDB"></stop>
            </linearGradient>
            <linearGradient id="zk-gv" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#FFFFFF" stop-opacity=".12"></stop>
              <stop offset=".3" stop-color="#FFFFFF" stop-opacity="0"></stop>
              <stop offset=".85" stop-color="#6B655C" stop-opacity="0"></stop>
              <stop offset="1" stop-color="#6B655C" stop-opacity=".07"></stop>
            </linearGradient>
            <clipPath id="zk-pages"><path d="M24 22 C 180 12, 400 14, 520 30 L 520 676 C 400 688, 180 686, 26 680 C 21 480, 21 220, 24 22 Z M520 30 C 640 14, 860 12, 1016 22 C 1019 220, 1019 480, 1014 680 C 860 686, 640 688, 520 676 Z"></path></clipPath>
          </defs>

          <g filter="url(#zk-paper)">
            <path fill="#D3CEC7" d="M12.1 24.5 C 176.4 18.3, 400 20.3, 520 32.5 L 520 682.3 C 400 694.3, 180 692.3, 14.1 686.3 Z"/><path fill="#D3CEC7" d="M520 32.5 C 640 20.3, 860 18.3, 1027.9 24.5 C 1030.9 220, 1030.9 480, 1025.9 686.3 C 860 692.3, 640 694.3, 520 682.3 Z"/><path fill="#F2F0EC" d="M13.8 24.2 C 176.9 17.4, 400 19.4, 520 32.2 L 520 681.4 C 400 693.4, 180 691.4, 15.8 685.4 Z"/><path fill="#F2F0EC" d="M520 32.2 C 640 19.4, 860 17.4, 1026.2 24.2 C 1029.2 220, 1029.2 480, 1024.2 685.4 C 860 691.4, 640 693.4, 520 681.4 Z"/><path fill="#D3CEC7" d="M15.5 23.8 C 177.4 16.5, 400 18.5, 520 31.8 L 520 680.5 C 400 692.5, 180 690.5, 17.5 684.5 Z"/><path fill="#D3CEC7" d="M520 31.8 C 640 18.5, 860 16.5, 1024.5 23.8 C 1027.5 220, 1027.5 480, 1022.5 684.5 C 860 690.5, 640 692.5, 520 680.5 Z"/><path fill="#F2F0EC" d="M17.2 23.4 C 178.0 15.6, 400 17.6, 520 31.4 L 520 679.6 C 400 691.6, 180 689.6, 19.2 683.6 Z"/><path fill="#F2F0EC" d="M520 31.4 C 640 17.6, 860 15.6, 1022.8 23.4 C 1025.8 220, 1025.8 480, 1020.8 683.6 C 860 689.6, 640 691.6, 520 679.6 Z"/><path fill="#D3CEC7" d="M18.9 23.1 C 178.5 14.7, 400 16.7, 520 31.1 L 520 678.7 C 400 690.7, 180 688.7, 20.9 682.7 Z"/><path fill="#D3CEC7" d="M520 31.1 C 640 16.7, 860 14.7, 1021.1 23.1 C 1024.1 220, 1024.1 480, 1019.1 682.7 C 860 688.7, 640 690.7, 520 678.7 Z"/><path fill="#F2F0EC" d="M20.6 22.7 C 179.0 13.8, 400 15.8, 520 30.7 L 520 677.8 C 400 689.8, 180 687.8, 22.6 681.8 Z"/><path fill="#F2F0EC" d="M520 30.7 C 640 15.8, 860 13.8, 1019.4 22.7 C 1022.4 220, 1022.4 480, 1017.4 681.8 C 860 687.8, 640 689.8, 520 677.8 Z"/><path fill="#D3CEC7" d="M22.3 22.4 C 179.5 12.9, 400 14.9, 520 30.4 L 520 676.9 C 400 688.9, 180 686.9, 24.3 680.9 Z"/><path fill="#D3CEC7" d="M520 30.4 C 640 14.9, 860 12.9, 1017.7 22.4 C 1020.7 220, 1020.7 480, 1015.7 680.9 C 860 686.9, 640 688.9, 520 676.9 Z"/>
            <path d="M24 22 C 180 12, 400 14, 520 30 L 520 676 C 400 688, 180 686, 26 680 C 21 480, 21 220, 24 22 Z" fill="url(#zk-gl)"></path>
            <path d="M520 30 C 640 14, 860 12, 1016 22 C 1019 220, 1019 480, 1014 680 C 860 686, 640 688, 520 676 Z" fill="url(#zk-gr)"></path>
            <g clip-path="url(#zk-pages)">
              <rect x="0" y="0" width="1040" height="700" fill="url(#zk-gv)"></rect>
              <path d="M520 0 L520 700" stroke="#7E786F" stroke-width="1.2" opacity=".55"></path>
            </g>
          </g>
        </svg>
        <section class="book__left" aria-label="Левая страница">
          <div class="hero">
            <h1 class="hero__title ink">Кривенько —<br>значит искренне</h1>
            <a class="btn hero__btn" href="templates.html">Сделать зин <span aria-hidden="true">→</span></a>
          </div>
        </section>
        <img class="book__drawing ink" src="assets/main-drawing.webp" alt="Карандашный рисунок той же сцены">
        <img class="book__photo" src="assets/main-photo.webp" alt="Фото: ноги в кедах и белый шпиц на брусчатке">
        <div class="book__light" id="light" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <div class="mpages">
    <section class="mpage mpage--hero">
      <div class="hero">
        <p class="hero__title ink" aria-hidden="true">Кривенько —<br>значит искренне</p>
        <a class="btn hero__btn" href="templates.html">Сделать зин <span aria-hidden="true">→</span></a>
      </div>
    </section>
    <section class="mpage mpage--photo" aria-label="Страница зина">
      <img src="assets/main-photo.webp" alt="Фото: ноги в кедах и белый шпиц на брусчатке">
      <img class="ink" src="assets/main-drawing.webp" alt="Карандашный рисунок той же сцены">
    </section>
  </div>
</div>
<script src="js/home.js"></script>
</body>
</html>
