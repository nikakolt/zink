<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZINK</title>
<meta name="description" content="Кривенько, значит искренне">
<meta property="og:title" content="ZINK">
<meta property="og:description" content="Кривенько, значит искренне">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ZINK">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=PT+Sans:wght@400;700&family=PT+Sans+Narrow:wght@700&family=PT+Mono&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
.home { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
.home__head { padding: 24px 36px; flex: none; position: relative; z-index: 2; }
.home__main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(320px, 38%) 1fr; align-items: center; }

/* Левый блок: как был */
.hero { display: flex; flex-direction: column; gap: 28px; padding-left: max(56px, 11vw); margin-top: -6vh; animation: zkin 1s cubic-bezier(.2,.7,.2,1) both; }
.hero__title { margin: 0; font-family: 'Courier New', 'Courier Prime', 'Nimbus Mono PS', FreeMono, monospace; font-weight: 400; font-size: 40px; line-height: 1.08; letter-spacing: -0.02em; text-shadow: 0 0 .6px rgba(20,20,19,.55); color: #141413; }
.hero__btn { align-self: flex-start; height: 50px; min-height: 50px; padding: 0 24px; background: #141413; color: #F4F2EC; font-size: 17px; letter-spacing: -.01em; }

/* 3D-зин */
.scene { position: relative; width: 100%; height: 100%; perspective: 2000px; perspective-origin: 50% 35%; }
.scene__float { position: absolute; left: 50%; top: 47%; width: 0; height: 0; transform-style: preserve-3d; }
.zine { position: absolute; transform-style: preserve-3d; opacity: 0; transition: opacity .35s ease; }
.zine.is-ready { opacity: 1; }
.scene.is-ready .floor { visibility: visible; }
.leaf { position: absolute; left: 50%; top: 0; transform-origin: 0 50%; transform-style: preserve-3d; }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: #F1EDE4; overflow: hidden; }
.face--back { transform: rotateY(180deg); }
.face canvas { display: block; width: 100%; height: 100%; }
/* бумага и потёртости рисуются прямо на страницах (js/home3d.js) */
.face--front::after, .face--back::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.face--front::after { background: linear-gradient(90deg, rgba(40,36,30,.28), rgba(40,36,30,.08) 6%, rgba(40,36,30,0) 22%); }
.face--back::after { background: linear-gradient(270deg, rgba(40,36,30,.28), rgba(40,36,30,.08) 6%, rgba(40,36,30,0) 22%); }
.shade { position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0; }
.face--front .shade { background: linear-gradient(90deg, rgba(20,18,15,.55), rgba(20,18,15,.12) 55%, rgba(255,255,255,.08)); }
.face--back .shade { background: linear-gradient(270deg, rgba(20,18,15,.55), rgba(20,18,15,.12) 55%, rgba(255,255,255,.08)); }
.edge { position: absolute; top: 0; height: 100%; width: 3px; background: linear-gradient(90deg, #E9E7E2, #D8D5CF); }
.floor { position: absolute; left: 50%; top: 47%; visibility: hidden; border-radius: 50%; background: radial-gradient(closest-side, rgba(40,36,30,.30), rgba(40,36,30,0)); pointer-events: none; }

@keyframes zkin { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

@media (max-width: 760px) {
  .home { height: auto; min-height: 100dvh; overflow: visible; }
  .home__head { padding: 18px 20px; }
  .home__main { display: flex; flex-direction: column; align-items: stretch; }
  .hero { padding: 36px 24px 8px; margin-top: 0; }
  .hero__title { font-size: clamp(28px, 8.4vw, 40px); }
  .scene { height: min(100vw, 520px); }
}
</style>
</head>
<body>
<div class="home" id="home">
  <header class="home__head"><a class="logo" href="index.html">ZINK</a></header>

  <main class="home__main">
    <div class="hero">
      <h1 class="hero__title ink">Кривенько,<br>значит искренне</h1>
      <a class="btn hero__btn" href="templates.html">Сделать зин <span aria-hidden="true">→</span></a>
    </div>

    <div class="scene" id="scene" aria-label="Зин листается сам: обложка, развороты, задник" role="img">
      <div class="floor" id="floor" aria-hidden="true"></div>
      <div class="scene__float" id="float">
        <div class="zine" id="zine" aria-hidden="true"></div>
      </div>
    </div>
  </main>
</div>
<script src="js/home-pages.js?v=10"></script>
<script src="js/home3d.js?v=9"></script>
</body>
</html>
