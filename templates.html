<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZINK · шаблоны</title>
<meta name="description" content="Кривенько, значит искренне">
<meta property="og:title" content="ZINK">
<meta property="og:description" content="Кривенько, значит искренне">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ZINK">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=PT+Sans:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
.lib { flex: 1; min-height: 0; width: 100%; max-width: 1280px; margin: 0 auto; padding: 32px 40px; display: flex; flex-direction: column; justify-content: safe center; gap: 28px; overflow-y: auto; }
.lib__head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.lib__title { margin: 0; font-weight: 700; font-size: 40px; letter-spacing: -0.045em; line-height: 1; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 36px 28px; }
/* Карточки держат высоту окна: ширина считается от доступной высоты */
.grid { --cw: min(280px, calc((100vw - 80px - 84px) / 4), calc((100dvh - 61px - 64px - 68px - 36px - 68px) / 2 / .7)); grid-template-columns: repeat(4, var(--cw)); justify-content: space-between; }
.card { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: #111111; }
.card__thumb { width: 100%; aspect-ratio: 10 / 7; }
.card--live .card__thumb { box-shadow: 0 10px 24px rgba(0,0,0,.14); transition: transform .25s, box-shadow .25s; }
.card--live .card__thumb img { width: 100%; height: 100%; object-fit: cover; }
.card--live:hover .card__thumb { transform: translateY(-4px); box-shadow: 0 18px 34px rgba(0,0,0,.18); }
.card--blank .card__thumb { background: linear-gradient(90deg, #FFFFFF 0 46%, #EDEDEA 49.6%, #E4E4E0 50%, #F1F1EE 50.6%, #FFFFFF 54%); box-shadow: 0 0 0 1px #ECECE8, 0 8px 20px rgba(0,0,0,.06); }
.card--own .card__thumb { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; border: 1.5px dashed #BDBDB8; background: #FAFAF8; transition: border-color .2s, background .2s, transform .25s; }
.card--own:hover .card__thumb { border-color: #111111; background: #FFFFFF; transform: translateY(-4px); }
.own__plus { font: 300 40px/1 Inter, sans-serif; }
.own__txt { font-size: 13px; line-height: 1.35; color: #4A4742; text-align: center; }
.card--my { position: relative; }
.card--my > a { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; }
.card--my .card__thumb { background: #F1F1EE; }
.card__del { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border: 0; border-radius: 50%; background: rgba(255,255,255,.92); box-shadow: 0 1px 4px rgba(0,0,0,.18); cursor: pointer; font: 400 18px/28px Inter, sans-serif; color: #111111; opacity: 0; transition: opacity .2s; }
.card--my:hover .card__del, .card__del:focus-visible { opacity: 1; }
.card__ask { position: absolute; left: 0; right: 0; top: 0; aspect-ratio: 10 / 7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(255,255,255,.94); font-size: 15px; }
.card__ask div { display: flex; gap: 8px; }
.card__ask button { min-height: 34px; padding: 0 14px; border: 1px solid #111111; background: #FFFFFF; cursor: pointer; font: 500 13px Inter, sans-serif; }
.card__ask button.yes { background: #111111; color: #FFFFFF; }
.card--hint .card__thumb { display: flex; align-items: center; justify-content: center; padding: 20px; border: 1.5px dashed #D6D6D2; color: #8A8A86; font-size: 13px; line-height: 1.4; text-align: center; }
.lib__sub { margin: 8px 0 -8px; font-weight: 600; font-size: 22px; letter-spacing: -0.03em; }
.card__meta { display: flex; justify-content: space-between; align-items: baseline; }
.card__name { font-weight: 600; font-size: 15px; }
.card__ph { height: 8px; width: 90px; background: #EDEDEA; margin-top: 6px; }

@media (max-width: 900px) {
  .app { height: auto; min-height: 100dvh; overflow: visible; }
  .lib { padding: 24px 20px 40px; justify-content: flex-start; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 16px; }
  .lib__title { font-size: 32px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="logo" href="index.html">ZINK</a>
    <nav aria-label="Шаги">
      <ol class="steps mono">
        <li><a href="templates.html" aria-current="step">01 шаблон</a></li>
        <li><a href="editor.html">02 редактор</a></li>
        <li><a href="print.html">03 печать</a></li>
      </ol>
    </nav>
    <span class="topbar__right"></span>
  </header>

  <main class="lib">
    <div class="lib__head">
      <h1 class="lib__title">Шаблоны</h1>
      <span class="mono muted">8 страниц · один лист A4</span>
    </div>
    <div class="grid" id="grid">
      <a class="card card--live" href="editor.html?t=1&new=1">
        <div class="card__thumb"><img src="assets/tpl1/spread-0.webp" alt="Обложка и задник шаблона 1"></div>
        <div class="card__meta"><span class="card__name">Шаблон 1</span><span class="mono muted">01</span></div>
      </a>
      <a class="card card--live" href="editor.html?t=2&new=1">
        <div class="card__thumb"><img src="assets/tpl2/spread-0.webp" alt="Обложка и задник шаблона 2"></div>
        <div class="card__meta"><span class="card__name">Шаблон 2</span><span class="mono muted">02</span></div>
      </a>
      <a class="card card--own" href="builder.html?new=1">
        <div class="card__thumb"><span class="own__plus" aria-hidden="true">+</span><span class="own__txt">Собрать из страниц<br>любых шаблонов</span></div>
        <div class="card__meta"><span class="card__name">Свой зин</span><span class="mono muted">свой</span></div>
      </a>
      <div class="card card--blank" aria-label="Пустой шаблон"><div class="card__thumb"></div><div class="card__meta"><span class="card__ph"></span><span class="mono" style="color:#C4C4BF">04</span></div></div>
    </div>

    <h2 class="lib__sub">Мои шаблоны</h2>
    <div class="grid" id="my"></div>
  </main>
</div>
<script src="js/my.js"></script>
<script>
  // Мои шаблоны: сохранённые перед печатью. Их можно открыть или удалить, основные: нет
  (function () {
    var box = document.getElementById('my');
    function date(ts) { var d = new Date(ts); return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2); }
    function render() {
      var list = ZINK_MY.index(); box.innerHTML = '';
      if (!list.length) {
        box.innerHTML = '<div class="card card--hint"><div class="card__thumb">Перед печатью зин можно сохранить, и он появится здесь</div></div>';
        return;
      }
      list.forEach(function (m) {
        var c = document.createElement('div'); c.className = 'card card--live card--my';
        var a = document.createElement('a'); a.href = 'editor.html?m=' + m.id + '&new=1';
        a.innerHTML = '<div class="card__thumb"><img alt=""></div><div class="card__meta"><span class="card__name"></span><span class="mono muted">' + date(m.created) + '</span></div>';
        a.querySelector('.card__name').textContent = m.name;
        a.querySelector('img').alt = 'Обложка и задник: ' + m.name;
        var del = document.createElement('button'); del.type = 'button'; del.className = 'card__del'; del.textContent = '×';
        del.setAttribute('aria-label', 'Удалить шаблон «' + m.name + '»');
        del.addEventListener('click', function () {
          if (c.querySelector('.card__ask')) return;
          var ask = document.createElement('div'); ask.className = 'card__ask';
          ask.innerHTML = '<span>Удалить шаблон?</span><div><button type="button" class="yes">Удалить</button><button type="button" class="no">Отмена</button></div>';
          ask.querySelector('.yes').addEventListener('click', function () { ZINK_MY.del(m.id).then(render); });
          ask.querySelector('.no').addEventListener('click', function () { ask.remove(); });
          c.appendChild(ask); ask.querySelector('.no').focus();
        });
        c.appendChild(a); c.appendChild(del); box.appendChild(c);
        ZINK_MY.get(m.id).then(function (r) { if (r && r.thumb) a.querySelector('img').src = r.thumb; });
      });
    }
    render();
  })();
</script>
</body>
</html>
